<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin and credit: what each gives the other</title>
  <desc id="desc">Two boxes, Bitcoin on the left holding savings and settlement, credit on the right carrying wages, loans and daily trade. An arrow from Bitcoin to credit reads anchor, exit and settlement; an arrow from credit to Bitcoin reads freed resources put back to work.</desc>
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#77736c" stop-opacity=".24"/>
      <stop offset=".6" stop-color="#8f8a80" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f4f0e7" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .35  0 0 0 .12 0"/>
    </filter>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(32)" patternUnits="userSpaceOnUse">
      <path d="M0 0V9" stroke="#595750" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="9" height="9" patternTransform="rotate(-28)" patternUnits="userSpaceOnUse">
      <path d="M0 0V9M0 0H9" stroke="#595750" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L11 6 1 11" fill="none" stroke="#45443f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#f3efe6"/>
  <ellipse cx="500" cy="260" rx="460" ry="230" fill="url(#halo)"/>
  <rect width="1000" height="520" filter="url(#paper-grain)" opacity=".34"/>

  <g fill="none" stroke="#45443f" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bitcoin box. -->
    <path d="M62 152c80-3 170-2 250 1 3 72 2 146-1 218-82 3-168 2-248-1-3-72-3-146-1-218z" fill="url(#cross)" stroke-width="2.4"/>
    <!-- Credit box. -->
    <path d="M688 153c82-3 168-2 250-1 3 72 2 146-1 218-80 3-170 3-250 0-2-72-2-146 1-217z" fill="url(#hatch)" stroke-width="2.4"/>

    <!-- Bitcoin to credit, over the top. -->
    <path d="M300 140c110-80 290-80 396 0" stroke-width="2.2" marker-end="url(#head)"/>
    <path d="M306 148c108-74 280-74 384-2" stroke-width="1" opacity=".35"/>
    <!-- Credit to Bitcoin, under the bottom. -->
    <path d="M700 382c-110 80-290 80-396 0" stroke-width="2.2" marker-end="url(#head)"/>
    <path d="M694 374c-108 74-280 74-384 2" stroke-width="1" opacity=".35"/>
  </g>

  <g fill="#3d3c37" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="187" y="215" font-size="34">Bitcoin</text>
    <text x="187" y="262" font-size="19" fill="#55534c">holds savings</text>
    <text x="187" y="290" font-size="19" fill="#55534c">not yet decided</text>
    <text x="187" y="330" font-size="19" fill="#55534c">settles balances</text>

    <text x="813" y="215" font-size="34">Credit</text>
    <text x="813" y="262" font-size="19" fill="#55534c">carries wages,</text>
    <text x="813" y="290" font-size="19" fill="#55534c">loans and</text>
    <text x="813" y="318" font-size="19" fill="#55534c">daily trade</text>

    <text x="500" y="40" font-size="21">anchor · exit · settlement</text>
    <text x="500" y="64" font-size="16" fill="#55534c">a limit credit cannot inflate away</text>

    <text x="500" y="470" font-size="21">freed resources put back to work</text>
    <text x="500" y="498" font-size="16" fill="#55534c">a use for what savers hold</text>
  </g>
</svg>
