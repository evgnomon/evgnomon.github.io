<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Those Who Pay Will Decide</title>
  <desc id="desc">Graphite drawing of ordinary people gathered around a ballot box on textured warm paper.</desc>
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#77736c" stop-opacity=".28"/>
      <stop offset=".58" stop-color="#8f8a80" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f4f0e7" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .35  0 0 0 .12 0"/>
    </filter>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(32)" patternUnits="userSpaceOnUse">
      <path d="M0 0V9" stroke="#595750" stroke-opacity=".27" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#f3efe6"/>
  <ellipse cx="600" cy="362" rx="480" ry="265" fill="url(#halo)"/>
  <rect width="1200" height="675" filter="url(#paper-grain)" opacity=".34"/>

  <g fill="none" stroke="#45443f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M149 532c133-18 266-16 399-10 179 8 345 3 505-17" stroke-width="2.1" opacity=".56"/>
    <path d="M163 541c176-11 351-7 524-2 119 3 238-2 367-12" stroke-width="1.2" opacity=".4"/>

    <!-- A close, hand-drawn ballot box anchors the gathering. -->
    <path d="m446 351 150-74 170 63-158 82z" stroke-width="3.1"/>
    <path d="m446 351 4 120 159 84-1-133z" stroke-width="3.1"/>
    <path d="m609 422 157-82-2 119-155 96" stroke-width="3.1"/>
    <path d="m534 316 98 37 63-31" stroke-width="3.2"/>
    <path d="m534 322 98 38 63-33" stroke-width="1.2" opacity=".68"/>
    <path d="m459 361 143 71m-142-59 143 72m-141-59 141 72m-140-58 139 71" stroke-width="1" opacity=".27"/>
    <path d="m620 432 132-69m-132 83 131-69m-130 84 130-69m-130 84 129-69" stroke-width="1" opacity=".27"/>
    <path d="m556 287 97-50 63 24-99 49z" fill="#e9e5dc" stroke-width="2.1"/>
    <path d="m570 285 77-39m-68 44 74-37" stroke-width="1.15" opacity=".62"/>

    <!-- Figures are deliberately anonymous: the people, not leaders, fill the scene. -->
    <path d="M226 498c-6-44 4-80 32-104 18-15 44-16 62 0 25 23 31 62 27 106m-117-61c-17 18-25 43-27 71m125-70c19 20 24 42 23 68" stroke-width="2.6"/>
    <ellipse cx="289" cy="354" rx="31" ry="40" stroke-width="2.7"/>
    <path d="M258 350c2-29 17-44 35-45 21-1 35 15 39 38-20-4-37-15-47-29-5 17-13 28-27 36z" fill="url(#hatch)" stroke-width="2"/>
    <path d="M248 431c21 13 59 14 84-2m-87 17c27 11 61 12 91-1" stroke-width="1.3" opacity=".62"/>

    <path d="M355 507c-4-49 3-86 27-108 18-17 45-17 65 1 24 23 29 62 27 105m-105-66c-17 21-22 44-22 72m113-72c15 18 21 41 22 68" stroke-width="2.7"/>
    <ellipse cx="416" cy="361" rx="29" ry="39" stroke-width="2.6"/>
    <path d="M387 353c5-28 17-41 34-41 18 0 31 13 36 37-21-2-42-10-55-23-3 13-7 21-15 27z" fill="url(#hatch)" stroke-width="1.9"/>
    <path d="m392 426 35 21 37-23m-66 37 34 19 39-22" stroke-width="1.2" opacity=".52"/>

    <path d="M786 504c-2-48 5-84 29-106 20-18 46-17 65 2 22 23 28 60 24 104m-108-69c-15 19-21 42-20 69m112-67c17 18 22 42 22 67" stroke-width="2.7"/>
    <ellipse cx="847" cy="357" rx="30" ry="39" stroke-width="2.7"/>
    <path d="M817 354c4-26 17-42 34-43 20-1 34 14 38 39-18-2-39-11-52-26-3 15-10 24-20 30z" fill="url(#hatch)" stroke-width="2"/>
    <path d="M813 432c22 12 56 13 81-1m-83 17c26 12 56 11 84-1" stroke-width="1.2" opacity=".6"/>

    <path d="M922 514c-5-44 3-79 26-99 19-17 43-17 61 1 22 22 27 56 25 96m-101-63c-15 18-19 38-20 63m105-62c16 18 21 39 20 62" stroke-width="2.5"/>
    <ellipse cx="972" cy="371" rx="28" ry="37" stroke-width="2.5"/>
    <path d="M944 365c4-25 15-39 31-40 18-1 31 13 35 36-19-2-35-9-48-23-3 12-9 20-18 27z" fill="url(#hatch)" stroke-width="1.8"/>
    <path d="m946 439 29 18 35-18m-62 33 31 16 35-18" stroke-width="1.15" opacity=".55"/>

    <!-- A paper held above the box suggests the choice still belongs to the crowd. -->
    <path d="m624 205 72 22-17 54-73-23z" fill="#f4f0e7" stroke-width="2.4"/>
    <path d="m617 213 68 21m-72-10 66 21m-68-10 42 14" stroke-width="1.1" opacity=".55"/>
    <path d="M591 274c-18-20-31-31-45-36m133 27c22-14 40-20 59-21" stroke-width="2" opacity=".65"/>
    <path d="M600 265c-8-18-17-25-30-29m127 19c15-10 28-14 42-15" stroke-width="1.1" opacity=".48"/>

    <path d="M123 567c136-15 251-7 364-2m227 7c144-4 252-11 370-25" stroke-width="1.3" opacity=".4"/>
    <path d="M188 578l58-12m12 13 39-9m591 3 40-9m31 8 48-11" stroke-width="1.1" opacity=".4"/>
  </g>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#827d73" stroke-opacity=".18"/>
</svg>
